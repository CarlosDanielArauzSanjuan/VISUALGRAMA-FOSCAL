<div id="toast"></div>

<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:10000;align-items:center;justify-content:center;">
  <div style="background:#fff;border:4px solid #000;padding:28px 32px;max-width:440px;width:90%;font-family:'Space Grotesk',sans-serif;font-size:10.5pt;box-shadow:8px 8px 0 #000;">
    <div id="modal-msg" style="margin-bottom:20px;font-size:11pt;line-height:1.5;font-weight:600;"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button id="modal-cancel" class="btn" style="margin:0;">Cancelar</button>
      <button id="modal-ok" class="btn btn-primary" style="width:auto;padding:8px 22px;margin:0;">Aceptar</button>
    </div>
  </div>
</div>

    <div id="autocomplete-list" style="display:none;position:fixed;z-index:9000;background:#fff;border:4px solid #000;box-shadow:4px 4px 0 #000;font-family:'JetBrains Mono',monospace;font-size:9pt;min-width:200px;max-height:160px;overflow-y:auto;"></div>

<div id="biblioteca-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:15000;align-items:center;justify-content:center;">
  <div style="background:#fff;border:4px solid #000;box-shadow:8px 8px 0 #000;padding:24px;width:90%;max-width:480px;font-family:'Space Grotesk',sans-serif;">
    <h3 style="font-size:10pt;font-weight:800;text-transform:uppercase;margin-bottom:12px;">📂 Mis guardados</h3>

  </div>
</div>
